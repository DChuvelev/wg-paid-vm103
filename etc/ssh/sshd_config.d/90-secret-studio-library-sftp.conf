# Managed by WG Paid / MGTS P32I. No credentials are stored here.
Match User library
    ChrootDirectory /srv/sftp
    ForceCommand internal-sftp -d /library -u 0002
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    PermitTTY no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
Match all
