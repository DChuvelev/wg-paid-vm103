<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Secret Studio VPN</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.45}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:6px;min-width:260px}
input,button{font:inherit;padding:9px 12px}
button{cursor:pointer}
#status,#accountStatus{min-height:1.5em}
.profile{border:1px solid #ccc;border-radius:8px;padding:14px;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions a,.actions button{font:inherit;padding:7px 10px}
.muted{opacity:.72}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Secret Studio VPN</h1>

<section id="authView">
<p id="intro">Enter your email to request a one-time sign-in link.</p>
<form id="login">
<label>Email <input id="email" type="email" autocomplete="email" required></label>
<button id="submit" type="submit">Send sign-in link</button>
</form>
<p id="status" role="status"></p>
</section>

<section id="accountView" class="hidden">
<p><strong id="accountEmail"></strong></p>
<p id="quota"></p>
<div id="profiles"></div>
<div class="actions">
<button id="addProfile" type="button" class="hidden">+ Add WireGuard connection</button>
<button id="logout" type="button">Sign out</button>
</div>
<p id="accountStatus" role="status"></p>
</section>
</main>

<script>
const authView=document.getElementById('authView');
const accountView=document.getElementById('accountView');
const form=document.getElementById('login');
const statusEl=document.getElementById('status');
const intro=document.getElementById('intro');
const submit=document.getElementById('submit');
const accountStatus=document.getElementById('accountStatus');
const profilesEl=document.getElementById('profiles');
const quotaEl=document.getElementById('quota');
const addProfileButton=document.getElementById('addProfile');
const inviteMode=location.pathname==='/invite'||location.pathname==='/invite/';
const accountMode=location.pathname==='/account'||location.pathname==='/account/';
let inviteToken='';
let accountState=null;

function cookieValue(name){
  const prefix=name+'=';
  for(const part of document.cookie.split(';')){
    const value=part.trim();
    if(value.startsWith(prefix)) return decodeURIComponent(value.slice(prefix.length));
  }
  return '';
}
function csrfHeaders(){
  const token=cookieValue('wg_access_csrf');
  return token?{'x-csrf-token':token}:{};
}
function primaryWireGuardLimit(me){
  const grants=[...(me.grants||[])].reverse();
  for(const grant of grants){
    if(grant.status!=='active') continue;
    if(grant.valid_until&&Date.parse(grant.valid_until)<=Date.now()) continue;
    for(const limit of (grant.protocol_limits||[])){
      if(limit.protocol==='wireguard') return {grant,limit};
    }
  }
  return null;
}
function actionButton(text,handler){
  const button=document.createElement('button');
  button.type='button';
  button.textContent=text;
  button.addEventListener('click',handler);
  return button;
}
function actionLink(text,href,downloadName){
  const link=document.createElement('a');
  link.textContent=text;
  link.href=href;
  if(downloadName) link.download=downloadName;
  else{link.target='_blank';link.rel='noopener';}
  return link;
}
function renderProfiles(rows){
  profilesEl.textContent='';
  if(!rows.length){
    const p=document.createElement('p');
    p.className='muted';
    p.textContent='No WireGuard connections yet.';
    profilesEl.appendChild(p);
    return;
  }
  rows.forEach((profile,index)=>{
    const box=document.createElement('article');
    box.className='profile';
    const title=document.createElement('h2');
    title.textContent=profile.label||('WireGuard connection '+(index+1));
    const state=document.createElement('p');
    state.textContent='Status: '+profile.status+(profile.tunnel_ip?' · '+profile.tunnel_ip:'');
    const actions=document.createElement('div');
    actions.className='actions';
    if(profile.status==='active'){
      actions.appendChild(actionLink('Download config','/v2/account/profiles/'+profile.id+'/config','wireguard-'+(index+1)+'.conf'));
      actions.appendChild(actionLink('Show QR','/v2/account/profiles/'+profile.id+'/qr.svg'));
      actions.appendChild(actionButton('Disable',()=>mutateProfile(profile.id,'revoke')));
    }else if(profile.status==='disabled'){
      actions.appendChild(actionButton('Reissue',()=>mutateProfile(profile.id,'reissue')));
    }
    box.append(title,state,actions);
    profilesEl.appendChild(box);
  });
}
async function loadAccount(){
  accountStatus.textContent='Loading…';
  const [meResponse,profilesResponse]=await Promise.all([
    fetch('/v2/account/me',{credentials:'same-origin'}),
    fetch('/v2/account/profiles',{credentials:'same-origin'})
  ]);
  if(meResponse.status===401||profilesResponse.status===401){
    location.replace('/');
    return;
  }
  if(!meResponse.ok||!profilesResponse.ok){
    accountStatus.textContent='Unable to load account.';
    return;
  }
  const me=await meResponse.json();
  const profiles=await profilesResponse.json();
  const entitlement=primaryWireGuardLimit(me);
  accountState={me,profiles,entitlement};
  document.getElementById('accountEmail').textContent=me.email;
  renderProfiles(profiles.filter((p)=>p.protocol==='wireguard'));
  if(entitlement){
    quotaEl.textContent='WireGuard connections: '+entitlement.limit.profile_count+' / '+entitlement.limit.profile_limit;
    addProfileButton.classList.toggle('hidden',!entitlement.limit.can_create);
  }else{
    quotaEl.textContent='WireGuard is not enabled for this account.';
    addProfileButton.classList.add('hidden');
  }
  accountStatus.textContent='';
  if(profiles.some((p)=>['requested','provisioning','disabling'].includes(p.status))){
    setTimeout(()=>loadAccount().catch(()=>{}),3000);
  }
}
async function mutateProfile(profileId,action){
  accountStatus.textContent=action==='reissue'?'Requesting reissue…':'Disabling…';
  const r=await fetch('/v2/account/profiles/'+profileId+'/'+action,{
    method:'POST',
    headers:csrfHeaders(),
    credentials:'same-origin'
  });
  if(r.status===401){location.replace('/');return;}
  if(r.status===403){accountStatus.textContent='Session validation failed. Sign in again.';return;}
  if(!r.ok){accountStatus.textContent='Unable to update this connection.';return;}
  await loadAccount();
}
addProfileButton.addEventListener('click',async()=>{
  if(!accountState||!accountState.entitlement||!accountState.entitlement.limit.can_create) return;
  accountStatus.textContent='Creating connection…';
  const r=await fetch('/v2/account/profiles',{
    method:'POST',
    headers:{'Content-Type':'application/json',...csrfHeaders()},
    credentials:'same-origin',
    body:JSON.stringify({
      grant_id:accountState.entitlement.grant.id,
      protocol:'wireguard'
    })
  });
  if(r.status===401){location.replace('/');return;}
  if(r.status===403){accountStatus.textContent='Session validation failed. Sign in again.';return;}
  if(!r.ok){accountStatus.textContent='Unable to create another connection.';return;}
  await loadAccount();
});
document.getElementById('logout').addEventListener('click',async()=>{
  accountStatus.textContent='Signing out…';
  const r=await fetch('/v2/auth/logout',{
    method:'POST',
    headers:csrfHeaders(),
    credentials:'same-origin'
  });
  if(r.ok||r.status===401){location.replace('/');return;}
  accountStatus.textContent='Unable to sign out.';
});

if(inviteMode){
  const raw=location.hash.startsWith('#')?location.hash.slice(1):'';
  inviteToken=new URLSearchParams(raw).get('token')||'';
  history.replaceState(null,'',location.pathname);
  intro.textContent='Enter your email to accept this invitation. We will send a link to verify the address and complete registration.';
  submit.textContent='Continue';
  if(!inviteToken){
    statusEl.textContent='This invitation link is invalid.';
    form.querySelectorAll('input,button').forEach((el)=>el.disabled=true);
  }
}else if(accountMode){
  authView.classList.add('hidden');
  accountView.classList.remove('hidden');
  loadAccount().catch(()=>{accountStatus.textContent='Unable to load account.';});
}else{
  fetch('/v2/account/me',{credentials:'same-origin'}).then((r)=>{
    if(r.ok) location.replace('/account');
  }).catch(()=>{});
}

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value;
  statusEl.textContent='Sending…';
  try{
    if(inviteMode){
      const r=await fetch('/v2/auth/invites/redeem',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({invite_token:inviteToken,email})
      });
      if(r.status===202) statusEl.textContent='Check your email for a link to verify the address and complete registration.';
      else if(r.status===400) statusEl.textContent='This invitation is invalid, expired, or already used.';
      else if(r.status===429) statusEl.textContent='Please try again later.';
      else statusEl.textContent='Unable to continue registration.';
    }else{
      const r=await fetch('/v2/auth/login/request',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email})
      });
      if(r.status===202) statusEl.textContent='If this address is registered, a sign-in link will be sent.';
      else if(r.status===404) statusEl.textContent='Sign-in is not active yet.';
      else if(r.status===429) statusEl.textContent='Please try again later.';
      else statusEl.textContent='Unable to request a sign-in link.';
    }
  }catch(_){
    statusEl.textContent=inviteMode?'Unable to continue registration.':'Unable to request a sign-in link.';
  }
});
</script>
</body>
</html>
