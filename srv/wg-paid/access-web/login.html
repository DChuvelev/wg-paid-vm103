<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Secret Studio Access</title></head>
<body><main><h1 id="heading">Secret Studio Access</h1><p id="intro">Enter your email to request a one-time sign-in link.</p><form id="login"><label>Email <input id="email" type="email" autocomplete="email" required></label><button id="submit" type="submit">Send sign-in link</button></form><p id="status" role="status"></p></main>
<script>
const form=document.getElementById('login');const statusEl=document.getElementById('status');const intro=document.getElementById('intro');const submit=document.getElementById('submit');
const inviteMode=location.pathname==='/invite'||location.pathname==='/invite/';let inviteToken='';
if(inviteMode){const raw=location.hash.startsWith('#')?location.hash.slice(1):'';inviteToken=new URLSearchParams(raw).get('token')||'';history.replaceState(null,'',location.pathname);intro.textContent='Enter your email to accept this invitation. We will send a link to verify the address and complete registration.';submit.textContent='Continue';if(!inviteToken){statusEl.textContent='This invitation link is invalid.';form.querySelectorAll('input,button').forEach((el)=>el.disabled=true);}}
form.addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('email').value;statusEl.textContent='Sending…';try{if(inviteMode){const r=await fetch('/v2/auth/invites/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invite_token:inviteToken,email})});if(r.status===202){statusEl.textContent='Check your email for a link to verify the address and complete registration.';}else if(r.status===400){statusEl.textContent='This invitation is invalid, expired, or already used.';}else if(r.status===429){statusEl.textContent='Please try again later.';}else{statusEl.textContent='Unable to continue registration.';}}else{const r=await fetch('/v2/auth/login/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});if(r.status===202){statusEl.textContent='If this address is registered, a sign-in link will be sent.';}else if(r.status===404){statusEl.textContent='Sign-in is not active yet.';}else if(r.status===429){statusEl.textContent='Please try again later.';}else{statusEl.textContent='Unable to request a sign-in link.';}}}catch(_){statusEl.textContent=inviteMode?'Unable to continue registration.':'Unable to request a sign-in link.';}});
</script></body></html>
