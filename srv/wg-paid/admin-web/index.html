<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Secret Studio VPN — Admin</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1040px;margin:42px auto;padding:0 20px;line-height:1.45}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
label{display:flex;flex-direction:column;gap:6px;min-width:240px}
input,select,button{font:inherit;padding:8px 11px}button{cursor:pointer}.hidden{display:none}.muted{opacity:.7}
.card{border:1px solid #ccc;border-radius:9px;padding:14px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 280px}
table{border-collapse:collapse;width:100%;margin:10px 0}th,td{text-align:left;border-bottom:1px solid #ddd;padding:8px 6px;vertical-align:top}.status{min-height:1.4em}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.danger{font-weight:600;border-color:#a33}.small{font-size:.9em}.deleting{font-weight:600}.retirement{border-left:4px solid #a33}.profile-choice{display:block;min-width:100%;padding:5px 0}.profile-choice input{margin-right:8px}.profile-choice input:disabled+span{opacity:.65}
</style>
</head>
<body>
<main>
<h1>Secret Studio VPN — Admin</h1>
<section id="loginView">
<p>Private management portal. Application authentication is required in addition to WireGuard access.</p>
<form id="loginForm"><label>Admin secret <input id="adminToken" type="password" autocomplete="current-password" required minlength="32"></label><button type="submit">Sign in</button></form>
<p id="loginStatus" class="status" role="status"></p>
</section>

<section id="adminView" class="hidden">
<div class="row"><strong>Admin session active</strong><span class="grow"></span><button id="logout" type="button">Sign out</button></div>
<p id="globalStatus" class="status" role="status"></p>

<article class="card">
<h2>Invites</h2>
<form id="inviteForm">
<label>Plan <select id="invitePlan" required></select></label>
<label>Intended email (optional) <input id="inviteEmail" type="email" autocomplete="off"></label>
<button type="submit">Create invite</button>
</form>
<div id="newInvite" class="hidden"><p><strong>New registration URL</strong></p><div class="row"><code id="inviteUrl" class="grow"></code><button id="copyInvite" type="button">Copy URL</button></div></div>
<p id="inviteStatus" class="status" role="status"></p>
<div id="inviteList"></div>
</article>

<article class="card">
<h2>Users</h2>
<form id="userSearch"><label>Email contains/exact <input id="userEmail" type="email" autocomplete="off"></label><button type="submit">Search</button><button id="allUsers" type="button">List users</button></form>
<p id="userStatus" class="status" role="status"></p>
<div id="userList"></div>
</article>
</section>
</main>
<script>
const $=(id)=>document.getElementById(id);
const loginView=$('loginView'),adminView=$('adminView'),loginStatus=$('loginStatus'),globalStatus=$('globalStatus');
function cookieValue(name){const p=name+'=';for(const raw of document.cookie.split(';')){const v=raw.trim();if(v.startsWith(p))return decodeURIComponent(v.slice(p.length));}return '';}
function adminCsrf(){const t=cookieValue('wg_admin_csrf');return t?{'x-admin-csrf-token':t}:{};}
async function api(path,opts={}){const o={credentials:'same-origin',...opts};o.headers={...(opts.headers||{})};if(o.method&& !['GET','HEAD','OPTIONS'].includes(o.method.toUpperCase()))Object.assign(o.headers,adminCsrf());const r=await fetch(path,o);if(r.status===401){showLogin('Admin session expired.');throw new Error('unauthorized');}return r;}
function showLogin(msg=''){stopDeletePolling();stopRetirementPolling();adminView.classList.add('hidden');loginView.classList.remove('hidden');loginStatus.textContent=msg;}
function showAdmin(){loginView.classList.add('hidden');adminView.classList.remove('hidden');loginStatus.textContent='';}
async function checkSession(){try{const r=await fetch('/v2/admin/session',{credentials:'same-origin'});if(r.ok){showAdmin();await refreshAll();}else showLogin();}catch(_){showLogin('Unable to reach admin service.');}}
$('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();loginStatus.textContent='Signing in…';try{const r=await fetch('/v2/admin/session/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token:$('adminToken').value})});$('adminToken').value='';if(r.ok){showAdmin();await refreshAll();}else if(r.status===401)loginStatus.textContent='Invalid admin secret.';else loginStatus.textContent='Unable to sign in.';}catch(_){loginStatus.textContent='Unable to sign in.';}});
$('logout').addEventListener('click',async()=>{globalStatus.textContent='Signing out…';try{const r=await api('/v2/admin/session/logout',{method:'POST'});if(r.ok||r.status===204){showLogin('Signed out.');globalStatus.textContent='';}}catch(_){}});
let plans=[];
async function loadPlans(){const r=await api('/v2/admin/plans');if(!r.ok)throw new Error('plans');plans=await r.json();const s=$('invitePlan');s.textContent='';for(const p of plans){const o=document.createElement('option');o.value=p.id;o.textContent=p.display_name+' ('+p.code+')';s.appendChild(o);}}
function fmt(v){return v?new Date(v).toLocaleString():'—';}
async function loadInvites(){const el=$('inviteList');$('inviteStatus').textContent='Loading…';const r=await api('/v2/admin/invites');if(!r.ok){$('inviteStatus').textContent='Unable to load invites.';return;}const rows=await r.json();el.textContent='';const t=document.createElement('table');t.innerHTML='<thead><tr><th>State</th><th>Email</th><th>Plan</th><th>Expires</th><th></th></tr></thead>';const b=document.createElement('tbody');for(const x of rows){const tr=document.createElement('tr');const plan=plans.find(p=>p.id===x.plan_id);for(const text of [x.state,x.intended_email||'any',plan?plan.code:x.plan_id,fmt(x.expires_at)]){const td=document.createElement('td');td.textContent=text;tr.appendChild(td);}const a=document.createElement('td');if(x.state==='active'){const btn=document.createElement('button');btn.type='button';btn.textContent='Revoke';btn.addEventListener('click',()=>revokeInvite(x.invite_id));a.appendChild(btn);}tr.appendChild(a);b.appendChild(tr);}t.appendChild(b);el.appendChild(t);$('inviteStatus').textContent=rows.length?rows.length+' invite(s).':'No invites.';}
$('inviteForm').addEventListener('submit',async(e)=>{e.preventDefault();$('inviteStatus').textContent='Creating…';const body={plan_id:$('invitePlan').value,intended_email:$('inviteEmail').value.trim()||null};const r=await api('/v2/admin/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){$('inviteStatus').textContent='Unable to create invite.';return;}const x=await r.json();const url='https://access.secret-studio.ru/invite#token='+encodeURIComponent(x.invite_token);$('inviteUrl').textContent=url;$('newInvite').classList.remove('hidden');$('inviteEmail').value='';$('inviteStatus').textContent='Invite created.';await loadInvites();});
$('copyInvite').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('inviteUrl').textContent);$('inviteStatus').textContent='Registration URL copied.';}catch(_){$('inviteStatus').textContent='Copy failed; select the URL manually.';}});
async function revokeInvite(id){$('inviteStatus').textContent='Revoking…';const r=await api('/v2/admin/invites/'+encodeURIComponent(id)+'/revoke',{method:'POST'});$('inviteStatus').textContent=r.ok?'Invite revoked.':'Unable to revoke invite.';if(r.ok)await loadInvites();}
function protocolLimit(grant,protocol){return (grant.protocol_limits||[]).find(x=>x.protocol===protocol)||null;}
const QUOTA_PROFILE_STATUSES=new Set(['requested','provisioning','active','disabling','provisioning_failed']);
function consumesQuota(profile){return QUOTA_PROFILE_STATUSES.has(profile.status);}
async function responseDetail(r,fallback){try{const body=await r.json();if(body&&typeof body.detail==='string'&&body.detail.length<=500)return body.detail;}catch(_){}return fallback;}
const DELETE_POLL_INTERVAL_MS=2500;
const DELETE_POLL_TIMEOUT_MS=60000;
let deletePollTimer=null,deletePollToken=0,deletePollTarget=null;
function stopDeletePolling(message=''){if(deletePollTimer!==null){clearTimeout(deletePollTimer);deletePollTimer=null;}deletePollToken+=1;deletePollTarget=null;if(message)$('userStatus').textContent=message;}
async function fetchUsers(email=''){const q=email?'?email='+encodeURIComponent(email):'';const r=await api('/v2/admin/users'+q);if(!r.ok)throw new Error('users');return await r.json();}
function scheduleDeletePoll(token){deletePollTimer=setTimeout(()=>pollDeletingUser(token),DELETE_POLL_INTERVAL_MS);}
function startDeletePolling(u,email){stopDeletePolling();deletePollTarget={userId:u.user_id,email:u.email,filter:email,deadline:Date.now()+DELETE_POLL_TIMEOUT_MS};const token=deletePollToken;$('userStatus').textContent='Deletion in progress for '+u.email+'. Refreshing automatically…';scheduleDeletePoll(token);}
async function pollDeletingUser(token){if(token!==deletePollToken||!deletePollTarget)return;if(Date.now()>=deletePollTarget.deadline){const email=deletePollTarget.email;stopDeletePolling('Automatic refresh timed out for '+email+'. Use Refresh to check again.');return;}const target=deletePollTarget;try{const rows=await fetchUsers(target.filter);if(token!==deletePollToken||!deletePollTarget)return;renderUsers(rows);const current=rows.find(x=>x.user_id===target.userId);if(!current){stopDeletePolling('User '+target.email+' deleted.');return;}if(!current.deletion_requested_at){stopDeletePolling('Automatic refresh stopped because deletion state changed. Use Refresh.');return;}$('userStatus').textContent='Deletion in progress for '+target.email+'. Refreshing automatically…';scheduleDeletePoll(token);}catch(e){if(token!==deletePollToken)return;if(e.message==='unauthorized'){stopDeletePolling();return;}stopDeletePolling('Automatic refresh stopped after an error. Use Refresh to check again.');}}
async function manualRefreshDeleting(u){const email=$('userEmail').value.trim();stopDeletePolling();const rows=await loadUsers(email);if(!rows)return;const current=rows.find(x=>x.user_id===u.user_id);if(current&&current.deletion_requested_at)startDeletePolling(current,email);}
const RETIREMENT_POLL_INTERVAL_MS=2500;
const RETIREMENT_POLL_TIMEOUT_MS=60000;
let retirementPollTimer=null,retirementPollToken=0,retirementPollTarget=null;
function stopRetirementPolling(message=''){if(retirementPollTimer!==null){clearTimeout(retirementPollTimer);retirementPollTimer=null;}retirementPollToken+=1;retirementPollTarget=null;if(message)$('userStatus').textContent=message;}
function scheduleRetirementPoll(token){retirementPollTimer=setTimeout(()=>pollRetirement(token),RETIREMENT_POLL_INTERVAL_MS);}
function startRetirementPolling(u,grantId,newLimit,selectedIds,filter){stopRetirementPolling();retirementPollTarget={userId:u.user_id,email:u.email,grantId,newLimit,selectedIds:new Set(selectedIds),filter,deadline:Date.now()+RETIREMENT_POLL_TIMEOUT_MS};const token=retirementPollToken;$('userStatus').textContent='Profile retirement in progress for '+u.email+'. Refreshing automatically…';scheduleRetirementPoll(token);}
async function pollRetirement(token){if(token!==retirementPollToken||!retirementPollTarget)return;if(Date.now()>=retirementPollTarget.deadline){const email=retirementPollTarget.email;stopRetirementPolling('Automatic retirement refresh timed out for '+email+'. Use Search or List users to check again.');return;}const target=retirementPollTarget;try{const rows=await fetchUsers(target.filter);if(token!==retirementPollToken||!retirementPollTarget)return;renderUsers(rows);const current=rows.find(x=>x.user_id===target.userId);const grant=current&&(current.grants||[]).find(x=>x.id===target.grantId);if(!current||!grant){stopRetirementPolling('Automatic retirement refresh stopped because the affected user or grant is unavailable. Use Search or List users.');return;}const limit=protocolLimit(grant,'wireguard');if(!limit){stopRetirementPolling('Automatic retirement refresh stopped because the WireGuard limit is unavailable. Use Search or List users.');return;}const selectedProfiles=(current.profiles||[]).filter(p=>target.selectedIds.has(p.id));const selectedRetired=selectedProfiles.length===target.selectedIds.size&&selectedProfiles.every(p=>!consumesQuota(p));if(limit.profile_count<=target.newLimit&&selectedRetired){stopRetirementPolling('Profile retirement completed for '+target.email+'. WireGuard limit is '+limit.profile_limit+'.');return;}$('userStatus').textContent='Profile retirement in progress for '+target.email+'. Refreshing automatically…';scheduleRetirementPoll(token);}catch(e){if(token!==retirementPollToken)return;if(e.message==='unauthorized'){stopRetirementPolling();return;}stopRetirementPolling('Automatic retirement refresh stopped after an error. Use Search or List users to check again.');}}
function renderUsers(rows){const host=$('userList');host.textContent='';for(const u of rows){const deleting=!!u.deletion_requested_at;const retirementForUser=retirementPollTarget&&retirementPollTarget.userId===u.user_id;const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=u.email;card.appendChild(h);const meta=document.createElement('p');meta.className='small muted';meta.textContent='User '+u.user_id+' · verified '+fmt(u.email_verified_at)+(deleting?' · deletion requested '+fmt(u.deletion_requested_at):'');card.appendChild(meta);if(deleting){const state=document.createElement('p');state.className='deleting';state.textContent='Deletion in progress: sessions and grants are revoked; remaining profiles are being disabled.';card.appendChild(state);}for(const g of (u.grants||[])){const retirementForGrant=retirementForUser&&retirementPollTarget.grantId===g.id;const box=document.createElement('div');box.className='card';const title=document.createElement('p');title.innerHTML='<strong>Grant</strong> ';title.append(document.createTextNode(g.status+' · '+g.id));box.appendChild(title);if(retirementForGrant){const state=document.createElement('p');state.className='deleting';state.textContent='Profile retirement in progress';box.appendChild(state);}const profiles=(u.profiles||[]).filter(p=>p.protocol==='wireguard'&&p.access_grant_id===g.id);const w=protocolLimit(g,'wireguard');if(w){const row=document.createElement('div');row.className='row';const info=document.createElement('span');info.textContent='WireGuard profiles: '+w.profile_count+' / '+w.profile_limit+(w.can_create?' · can create':'');const input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.value=String(w.profile_limit);input.style.width='90px';input.disabled=deleting||retirementForGrant;const btn=document.createElement('button');btn.type='button';btn.textContent='Set limit';btn.disabled=deleting||retirementForGrant;btn.addEventListener('click',()=>setLimit(u,g,w,profiles,input,box));row.append(info,input,btn);box.appendChild(row);}const p=document.createElement('p');p.className='small';p.textContent=profiles.length?'Profiles: '+profiles.map(x=>(x.label||x.id)+' ['+x.status+(x.tunnel_ip?' · '+x.tunnel_ip:'')+']').join('; '):'Profiles: none';box.appendChild(p);card.appendChild(box);}const actions=document.createElement('div');actions.className='row';const del=document.createElement('button');del.type='button';del.className='danger';del.textContent=deleting?'Deleting…':'Delete user';del.disabled=deleting||retirementForUser;del.addEventListener('click',()=>deleteUser(u));actions.appendChild(del);if(deleting){const refresh=document.createElement('button');refresh.type='button';refresh.textContent='Refresh';refresh.addEventListener('click',()=>manualRefreshDeleting(u));actions.appendChild(refresh);}card.appendChild(actions);host.appendChild(card);}}
async function loadUsers(email=''){try{$('userStatus').textContent='Loading…';const rows=await fetchUsers(email);renderUsers(rows);$('userStatus').textContent=rows.length?rows.length+' user(s).':'No users found.';return rows;}catch(e){if(e.message!=='unauthorized')$('userStatus').textContent='Unable to load users.';return null;}}
function showRetirementSelection(u,g,w,profiles,newLimit,box){const existing=box.querySelector('.retirement');if(existing)existing.remove();const required=w.profile_count-newLimit;const eligible=profiles.filter(consumesQuota);const panel=document.createElement('div');panel.className='card retirement';const heading=document.createElement('p');heading.innerHTML='<strong>Retirement required</strong>';panel.appendChild(heading);const summary=document.createElement('p');summary.textContent='Current quota-consuming usage: '+w.profile_count+'. Requested new limit: '+newLimit+'. Select exactly '+required+' profile(s) to retire.';panel.appendChild(summary);const selected=new Set();for(const profile of profiles){const label=document.createElement('label');label.className='profile-choice';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=profile.id;checkbox.disabled=!consumesQuota(profile);const text=document.createElement('span');text.textContent=(profile.label||profile.id)+' ['+profile.status+(profile.tunnel_ip?' · '+profile.tunnel_ip:'')+']'+(checkbox.disabled?' — historical; does not consume quota':'');label.append(checkbox,text);panel.appendChild(label);checkbox.addEventListener('change',()=>{if(checkbox.checked)selected.add(profile.id);else selected.delete(profile.id);count.textContent='Selected '+selected.size+' of '+required+'.';confirm.disabled=selected.size!==required;});}const count=document.createElement('p');count.className='small';count.textContent='Selected 0 of '+required+'.';panel.appendChild(count);const actions=document.createElement('div');actions.className='row';const confirm=document.createElement('button');confirm.type='button';confirm.className='danger';confirm.textContent='Confirm retirement + set limit';confirm.disabled=true;confirm.addEventListener('click',()=>confirmRetirement(u,g.id,newLimit,[...selected]));const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.addEventListener('click',()=>{panel.remove();$('userStatus').textContent='Retirement selection cancelled.';});actions.append(confirm,cancel);panel.appendChild(actions);if(eligible.length<required){confirm.disabled=true;const warning=document.createElement('p');warning.className='status';warning.textContent='Cannot submit safely: only '+eligible.length+' quota-consuming profile(s) are available for '+required+' required retirement(s). Refresh the user data.';panel.appendChild(warning);}$('userStatus').textContent='Retirement selection required for '+u.email+'. No limit change has been submitted.';box.appendChild(panel);}
async function updateLimit(u,grantId,newLimit,selectedIds){$('userStatus').textContent=selectedIds.length?'Submitting profile retirement…':'Updating limit…';const r=await api('/v2/admin/grants/'+encodeURIComponent(grantId)+'/protocol-limits/wireguard',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_limit:newLimit,retire_profile_ids:selectedIds})});if(!r.ok){$('userStatus').textContent=await responseDetail(r,'Unable to update profile limit.');return;}const result=await r.json();const filter=$('userEmail').value.trim();if(result.retirement_in_progress)startRetirementPolling(u,grantId,newLimit,selectedIds,filter);try{const rows=await fetchUsers(filter);renderUsers(rows);$('userStatus').textContent=result.retirement_in_progress?'Profile retirement in progress for '+u.email+'. Refreshing automatically…':'WireGuard profile limit updated.';}catch(e){if(e.message==='unauthorized')return;$('userStatus').textContent=result.retirement_in_progress?'Profile retirement was accepted, but immediate refresh failed. Automatic refresh will continue.':'Profile limit update was accepted, but automatic refresh failed. Use Search or List users to check status.';}}
async function confirmRetirement(u,grantId,newLimit,selectedIds){const ok=window.confirm('Retire '+selectedIds.length+' selected WireGuard profile(s) and set the limit to '+newLimit+'?\n\nThe selected connections will be disabled through the backend retirement lifecycle. This action cannot be undone from the user account.');if(!ok)return;await updateLimit(u,grantId,newLimit,selectedIds);}
async function setLimit(u,g,w,profiles,input,box){if(retirementPollTarget&&retirementPollTarget.userId===u.user_id&&retirementPollTarget.grantId===g.id){$('userStatus').textContent='Profile retirement is already in progress for this grant.';return;}const n=Number(input.value);if(!Number.isInteger(n)||n<0){$('userStatus').textContent='Profile limit must be a non-negative integer.';return;}if(w.profile_count>n){showRetirementSelection(u,g,w,profiles,n,box);return;}await updateLimit(u,g.id,n,[]);}
async function deleteUser(u){const ok=window.confirm('Delete user '+u.email+'?\n\nThis immediately revokes sessions and access. Active WireGuard profiles will be disabled and removed before the account is finally deleted.\n\nThis action cannot be undone.');if(!ok)return;stopDeletePolling();$('userStatus').textContent='Requesting deletion for '+u.email+'…';const r=await api('/v2/admin/users/'+encodeURIComponent(u.user_id),{method:'DELETE'});let body=null;try{body=await r.json();}catch(_){}if(!r.ok){$('userStatus').textContent=r.status===409?'User cannot be deleted in the current state.':'Unable to delete user.';return;}const filter=$('userEmail').value.trim();const rows=await loadUsers(filter);if(body&&body.status==='deleted'){$('userStatus').textContent='User '+u.email+' deleted.';return;}if(body&&body.status==='blocked_legacy_dependencies'){$('userStatus').textContent='Deletion blocked by '+body.legacy_dependency_count+' legacy dependency row(s).';return;}if(!rows)return;const current=rows.find(x=>x.user_id===u.user_id);if(!current){$('userStatus').textContent='User '+u.email+' deleted.';return;}if(body&&body.status==='deleting'){startDeletePolling(current,filter);return;}$('userStatus').textContent='Deletion requested. Use Refresh to check status.';}
$('userSearch').addEventListener('submit',async(e)=>{e.preventDefault();stopDeletePolling();stopRetirementPolling();await loadUsers($('userEmail').value.trim());});
$('allUsers').addEventListener('click',async()=>{stopDeletePolling();stopRetirementPolling();$('userEmail').value='';await loadUsers('');});
window.addEventListener('pagehide',()=>{stopDeletePolling();stopRetirementPolling();});
async function refreshAll(){globalStatus.textContent='Loading admin data…';try{await loadPlans();await Promise.all([loadInvites(),loadUsers('')]);globalStatus.textContent='';}catch(e){if(e.message!=='unauthorized')globalStatus.textContent='Unable to load admin data.';}}
checkSession();
</script>
</body>
</html>
